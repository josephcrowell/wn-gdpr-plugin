<div data-control="toolbar">
    <a href="<?= Backend::url('josephcrowell/gdpr/cookiegroups/create') ?>" class="btn btn-primary wn-icon-plus"><?= e(trans('backend::lang.form.create')) ?></a>
    <a href="<?= Backend::url('josephcrowell/gdpr/cookiegroups/reorder') ?>" class="btn btn-default wn-icon-list"><?= e(trans('backend::lang.reorder.default_title')) ?></a>
    <button
        type="button"
        class="btn btn-default wn-icon-trash-o"
        disabled="disabled"
        onclick="Snowboard.request(this, 'onDelete', {
            data: {
                checked: Array.from(document.querySelectorAll('.control-list tbody .list-checkbox input[type=checkbox]:checked'), function (checkbox) {
                    return checkbox.value;
                })
            },
            confirm: this.dataset.requestConfirm,
            loading: true,
            success: () => { this.disabled = true; }
        })"
        data-request-confirm="<?= e(trans('backend::lang.list.delete_selected_confirm')) ?>"
        data-trigger-action="enable"
        data-trigger=".control-list input[type=checkbox]"
        data-trigger-condition="checked">
        <?= e(trans('backend::lang.list.delete_selected')) ?>
    </button>
</div>
