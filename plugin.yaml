plugin:
    name: Winter GDPR
    description: 'josephcrowell.gdpr::lang.plugin.description'
    author: Joseph Crowell
    icon: icon-gavel
    homepage: 'https://github.com/josephcrowell/wn-gdpr-plugin'
    replaces:
        OFFLINE.GDPR: '*'
permissions:
    josephcrowell.gdpr.manage_cookie_consent:
        tab: 'josephcrowell.gdpr::lang.plugin.name'
        label: 'josephcrowell.gdpr::lang.permissions.manage_cookie_consent'
    josephcrowell.gdpr.manage_data_retention:
        tab: 'josephcrowell.gdpr::lang.plugin.name'
        label: 'josephcrowell.gdpr::lang.permissions.manage_data_retention'
    josephcrowell.gdpr.manage_cookie_groups:
        tab: 'josephcrowell.gdpr::lang.plugin.name'
        label: 'josephcrowell.gdpr::lang.permissions.manage_cookie_groups'
    josephcrowell.gdpr.manage_cookie_info:
        tab: 'josephcrowell.gdpr::lang.plugin.name'
        label: 'josephcrowell.gdpr::lang.permissions.manage_cookie_info'
    josephcrowell.gdpr.manage_logs:
        tab: 'josephcrowell.gdpr::lang.plugin.name'
        label: 'josephcrowell.gdpr::lang.permissions.manage_logs'
navigation:
    main-menu-item:
        label: Cookies
        url: josephcrowell/gdpr/logs
        icon: icon-question
        permissions:
            - josephcrowell.gdpr.manage_logs
