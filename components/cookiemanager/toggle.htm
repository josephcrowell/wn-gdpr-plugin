<input name="cookies[{{ cookie.code }}][enabled]"
       value="1"
       class="gdpr-ui-toggle gdpr-cookie-manager__toggle js-cookie-toggle"
       aria-label="{{ cookie.name }}"
       id="toggle-{{ cookie.id }}"
       type="checkbox"
        {{ isChecked or group.required ? 'checked' : '' }}
        {{ group.required ? 'disabled' : '' }}
/>
